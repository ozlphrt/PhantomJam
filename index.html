<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D Phantom Jam Simulation - Watch traffic waves and intersection bottleneck dynamics with Three.js WebGL and IDM physics." />
    <title>3D Phantom Jam with Intersection Crossing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <main id="main">
        <div id="simulation-area">
          <canvas id="road-canvas"></canvas>
          <div id="fps-hud" class="fps-hud">
            <span id="fps-dot" class="fps-dot"></span>
            <span id="fps-hud-val">--</span>
            <span class="fps-hud-unit">FPS</span>
          </div>

          <button id="hex-hud" class="hex-hud" type="button" title="Press H to toggle 3D Hexagonal Congestion Tunnel">
            <kbd class="hex-key">H</kbd>
            <span class="hex-label">Hexagons:</span>
            <span id="hex-hud-state" class="hex-state">OFF</span>
          </button>

          <button id="graph-hud" class="hex-hud graph-hud" type="button" title="Press G to toggle 3D Population Graph">
            <kbd class="hex-key">G</kbd>
            <span class="hex-label">Graph:</span>
            <span id="graph-hud-state" class="hex-state">OFF</span>
          </button>

          <svg id="jam-leader-svg" class="jam-leader-svg" style="opacity: 0;">
            <defs>
              <linearGradient id="jam-leader-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ff5c5c" stop-opacity="0.95" />
                <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.35" />
              </linearGradient>
            </defs>
            <line id="jam-leader-line" x1="0" y1="0" x2="0" y2="0" stroke="url(#jam-leader-grad)" stroke-width="1.75" />
            <line id="jam-leader-dash" x1="0" y1="0" x2="0" y2="0" stroke="#ff9f9a" stroke-width="1.75" stroke-dasharray="4 6" stroke-opacity="0.65" />
            <circle id="jam-anchor-ring" cx="0" cy="0" r="8" fill="rgba(255, 59, 48, 0.15)" stroke="#ff5c5c" stroke-width="1.5" />
            <circle id="jam-anchor-dot" cx="0" cy="0" r="3.5" fill="#ff3b30" />
          </svg>

          <div id="jam-callout" class="jam-callout" style="opacity: 0;">
            <div class="jam-callout-header">
              <span class="jam-pulse-dot"></span>
              <span class="jam-callout-title">CONGESTION CENTER</span>
              <span id="jam-severity" class="jam-severity">HEAVY</span>
            </div>
            <div class="jam-callout-stats">
              <div class="jam-stat">
                <span class="jam-stat-label">Queued</span>
                <span id="jam-stat-cars" class="jam-stat-val">0 cars</span>
              </div>
              <div class="jam-stat">
                <span class="jam-stat-label">Avg Speed</span>
                <span id="jam-stat-speed" class="jam-stat-val">0.0 m/s</span>
              </div>
              <div class="jam-stat">
                <span class="jam-stat-label">Wave Length</span>
                <span id="jam-stat-len" class="jam-stat-val">0 m</span>
              </div>
            </div>
            <div class="jam-callout-dock"></div>
          </div>
        </div>

        <button id="sidebar-trigger" class="btn-sidebar-trigger" style="opacity: 1; pointer-events: auto;">
          <svg class="cog-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <aside id="sidebar" class="collapsed">
          <div class="sidebar-header">
            <div class="sidebar-header-row">
              <h1>Phantom Jam 3D</h1>
              <button id="btn-close-sidebar" class="btn-close-sidebar">✕</button>
            </div>
            <span class="subtitle">Figure-8 highway · IDM physics · Treiber 2000</span>
          </div>

          <section class="panel" id="stats-panel">
            <h2>Simulation Stats</h2>
            <div class="stats-grid">
              <div class="stat-badge" id="stat-cars">
                <span class="stat-label">Vehicles</span>
                <span class="stat-value" id="val-cars">—</span>
              </div>
              <div class="stat-badge" id="stat-flow">
                <span class="stat-label">Avg Speed</span>
                <span class="stat-value" id="val-speed">—</span>
              </div>
              <div class="stat-badge jam-indicator" id="stat-jams">
                <span class="stat-label">Braking</span>
                <span class="stat-value" id="val-jams">0</span>
              </div>
              <div class="stat-badge" id="stat-fps">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="val-fps">—</span>
              </div>
            </div>
          </section>

          <section class="panel" id="controls-panel">
            <h2>Parameters</h2>

            <div class="control-group">
              <label for="ctrl-count">Vehicle count <span class="val-display" id="disp-count">300</span></label>
              <input type="range" id="ctrl-count" min="20" max="400" value="300" step="1" />
            </div>

            <div class="control-group">
              <label for="ctrl-speed">Sim speed <span class="val-display" id="disp-speed">1×</span></label>
              <input type="range" id="ctrl-speed" min="0.25" max="5" value="1" step="0.25" />
            </div>

            <div class="btn-row">
              <button id="btn-pause" class="btn btn-primary">⏸ Pause</button>
              <button id="btn-reset" class="btn btn-secondary">↺ Reset</button>
              <button id="btn-jam" class="btn btn-jam">⚡ Trigger Jam</button>
            </div>
          </section>

          <section class="panel" id="lighting-panel">
            <h2>Lighting &amp; Atmosphere</h2>

            <div class="control-group">
              <label for="ctrl-key-int">Sun Intensity <span class="val-display" id="disp-key-int">2.25</span></label>
              <input type="range" id="ctrl-key-int" min="0.2" max="4.0" value="2.25" step="0.05" />
            </div>

            <div class="control-group">
              <label for="ctrl-sun-el">Sun Elevation <span class="val-display" id="disp-sun-el">42°</span></label>
              <input type="range" id="ctrl-sun-el" min="15" max="85" value="42" step="1" />
            </div>

            <div class="control-group">
              <label for="ctrl-sun-az">Sun Azimuth <span class="val-display" id="disp-sun-az">-26°</span></label>
              <input type="range" id="ctrl-sun-az" min="-180" max="180" value="-26" step="1" />
            </div>

            <div class="control-group">
              <label for="ctrl-hemi-int">Ambient Light <span class="val-display" id="disp-hemi-int">1.52</span></label>
              <input type="range" id="ctrl-hemi-int" min="0.0" max="2.5" value="1.52" step="0.02" />
            </div>

            <div class="control-group">
              <label for="ctrl-fill-int">Fill Light <span class="val-display" id="disp-fill-int">0.40</span></label>
              <input type="range" id="ctrl-fill-int" min="0.0" max="2.0" value="0.4" step="0.05" />
            </div>

            <div class="control-group">
              <label for="ctrl-exposure">Exposure <span class="val-display" id="disp-exposure">1.16</span></label>
              <input type="range" id="ctrl-exposure" min="0.30" max="2.00" value="1.16" step="0.02" />
            </div>

            <div class="control-group">
              <label for="ctrl-fog-dist">Fog Start Dist <span class="val-display" id="disp-fog-dist">100m</span></label>
              <input type="range" id="ctrl-fog-dist" min="100" max="1000" value="100" step="25" />
            </div>

            <div class="btn-row">
              <button id="btn-copy-tuning" class="btn btn-primary" style="width: 100%;">📋 Copy Tuning to Clipboard</button>
            </div>
          </section>
        </aside>

        <button id="camera-cycle-btn" class="btn-camera-cycle">
          <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 8-6 4 6 4V8Z"/>
            <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
          </svg>
          <span id="cam-active-name" class="cam-label">Jam Cam</span>
        </button>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
